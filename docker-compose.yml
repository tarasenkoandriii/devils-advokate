# Локальная инфраструктура для отладки — ТОЛЬКО Postgres + Adminer.
# Приложения (apps/api, apps/tma, apps/admin, apps/landing) здесь НЕ
# контейнеризированы: этот файл для тех, кто запускает их на хосте через
# `npm run start:dev`/`npm run dev` — самый прямой путь к брейкпоинтам в
# IDE и самый быстрый hot-reload.
#
# ЕСЛИ НУЖЕН ВЕСЬ ПРОЕКТ В КОНТЕЙНЕРАХ (в том числе с дев-входами, без
# настоящего Telegram-бота) — это docker-compose.dev.yml, отдельный файл,
# см. DOCKER.md:
#
#     make up      # или: npm run docker:up
#
# Volume-мапинги и hot-reload там настроены (именно поэтому раньше в этом
# комментарии стояло «контейнер только усложнил бы» — усложняет не
# контейнер сам по себе, а контейнер без такой настройки). Два файла
# одновременно поднимать нельзя: оба публикуют Postgres на 5432.
#
# Это чисто дев-инструмент — Vercel (см. VERCEL.md) его вообще
# не видит и не использует: у serverless-деплоя свой билд-пайплайн на
# уровне Root Directory каждого проекта, docker-compose.yml в корне
# репозитория для него не существует.

services:
  postgres:
    image: postgres:16-alpine
    container_name: devils-advocate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devils_advocate
      POSTGRES_PASSWORD: devils_advocate
      POSTGRES_DB: devils_advocate
    ports:
      - '5432:5432'
    volumes:
      - devils_advocate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devils_advocate -d devils_advocate']
      interval: 5s
      timeout: 5s
      retries: 10

  # Лёгкий веб-интерфейс для просмотра БД во время отладки — не pgAdmin
  # (тяжелее, требует отдельной настройки логина), Adminer — один
  # контейнер без конфигурации, открыл http://localhost:8080 и всё.
  adminer:
    image: adminer:latest
    container_name: devils-advocate-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  devils_advocate_postgres_data:
