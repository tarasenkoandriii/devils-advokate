# Общий шаг установки для всех джоб CI: Node + npm ci + prisma generate.
#
# prisma generate обязателен ДО любой проверки: без сгенерированного
# клиента tsc в apps/api валится сотнями «Property ... does not exist on
# type PrismaClient», и ошибка выглядит как поломка кода, а не как
# отсутствующий шаг сборки.

# Пункт [ci-built-on-a-different-node] 2026-10-01 — версия Node жила в
# двух местах и РАЗОШЛАСЬ.
#
# Здесь было `node-version: '20'`, а Vercel собирает все четыре проекта
# на **24.x** (проверено в панели 2026-10-01). То есть зелёный CI не
# обещал ничего про сборку, которая реально поедет на прод: разные
# мажорные версии рантайма, разные предупреждения, разное поведение
# нативных зависимостей. Это тот же класс, что «потолок жил в двух
# местах» — только граница проходит между репозиторием и платформой.
#
# Теперь номер один, и он в `.nvmrc`: его читают и CI (через
# `node-version-file`), и человек локально (`nvm use`).
#
# ЧЕГО ЭТО НЕ ЗАКРЫВАЕТ, и это надо знать. Настройка Node у
# Vercel-проекта живёт В ПАНЕЛИ, а не в репозитории, и проверить её
# отсюда НЕЧЕМ: ни один тест не видит дашборд. Поэтому при смене `.nvmrc`
# её надо менять руками в четырёх проектах — так и записано в VERCEL.md.
# Поставить `engines.node` в package.json (его Vercel читает) здесь
# намеренно НЕ стали: жёсткая вилка ломает `npm ci` у всех, у кого
# локально другая мажорная версия, и это решение владельца, а не правка
# на ходу.

name: 'Setup monorepo'
description: 'Node из .nvmrc, npm ci, prisma generate'

# Пункт [the-actions-ran-on-a-runtime-github-deprecated] 2026-10-05 —
# мажоры действий подняты с v4 до v7, и вот почему именно до v7.
#
# ПОВОД. GitHub объявил Node 20 устаревшим и уже ПРИНУДИТЕЛЬНО запускал
# `actions/checkout@v4` и `actions/setup-node@v4` на 24: семь
# предупреждений в каждом прогоне, то есть рантайм действий определял не
# репозиторий, а платформа. Это тот же класс, что `[ci-built-on-a-different-node]`
# выше — версия рантайма решалась не там, где записана.
#
# ПОЧЕМУ НЕ v5, КАК СНАЧАЛА БЫЛО СКАЗАНО В ОТЧЁТЕ. Проверено по реестру
# тегов: актуальные мажоры — v7 у обоих, v5 отстаёт на два и получил бы
# это же предупреждение следующим. Чинить так, чтобы чинить опять, —
# не чинить.
#
# ЧТО ЛОМАЛОСЬ В КАЖДОМ МАЖОРЕ И ПОЧЕМУ ЭТОТ РЕПОЗИТОРИЙ ЭТО НЕ ТРОГАЕТ
# (прочитано в release notes, а не предположено):
#  • setup-node v5 — автоматическое кеширование при поле `packageManager`
#    в package.json. Здесь кеш задан ЯВНО (`cache: npm`) и поля
#    `packageManager` в репозитории нет, так что поведение не меняется;
#  • setup-node v6 — автокеширование сужено до npm. Тем более не наш
#    случай;
#  • checkout v5 — рантайм Node 24, минимальный раннер v2.327.1.
#    GitHub-hosted раннеры давно новее;
#  • checkout v6 — учётные данные пишутся в отдельный файл. Ни одна
#    джоба здесь не делает git-операций после checkout;
#  • checkout v7 — запрещён checkout форк-PR для `pull_request_target` и
#    `workflow_run`. Этот workflow запускается ТОЛЬКО по `push`.
#
# ЧЕГО ЭТО НЕ ПРОВЕРЯЕТ. Прогнать CI локально нечем, и единственная
# настоящая проверка — живой прогон. Поэтому подъём сделан отдельным
# коммитом: красное от него нельзя будет спутать с чужой правкой.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: npm

    - name: npm ci
      shell: bash
      run: npm ci

    - name: prisma generate
      shell: bash
      run: npm run prisma:generate --workspace=apps/api
