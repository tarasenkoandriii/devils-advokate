# CI монорепозитория — Пункт [lint-ci-strict] (аудит 2026-09-01).
#
# Что здесь проверяется и почему именно это:
#   lint      — ESLint с type-aware правилами; ядро — no-floating-promises
#               (забытый await в async-кодовой базе тайпчек не видит).
#   typecheck — tsc по всем четырём приложениям. С этого прохода спеки
#               ВНУТРИ тайпчека: раньше исключение **/*spec.ts скрывало
#               рассинхрон тестов с сигнатурами сервисов.
#   test      — jest + собственный standalone-раннер (63 спеки, которые
#               jest запускать не умеет — см. scripts/run-standalone-specs.js).
#   build     — nest build + next build трёх приложений: единственная
#               проверка, которая ловит ошибки уровня сборки Next.
#   prisma    — prisma validate: синтаксис и связность schema.prisma.
#               Конвенции схемы (индексы под FK и т.п.) проверяет
#               отдельный тест schema-conventions.spec.ts в джобе test.
#   db        — Пункт [the-sql-nobody-ran] 2026-10-01. НАСТОЯЩИЙ Postgres
#               16: `db push` на чистую базу, затем те ручные SQL-файлы,
#               которые применимы к ТЕКУЩЕЙ схеме (сейчас 18 из 19;
#               список считает scripts/check-manual-migrations.mjs).
#               Их применяет руками владелец в Supabase, и до этой джобы
#               НИЧТО не проверяло, что они вообще валидный SQL и что их
#               безопасно применить повторно.
#
#               Первый живой прогон сразу показал, почему «все 19» было
#               неверным вопросом: файл от 30 августа правит таблицы,
#               которые позднейшие правки схемы убрали, и на свежей базе
#               падает с «relation does not exist». Это свойство
#               истории, а не дефект файла; исторические исключаются
#               механически — по отсутствующим таблицам.
#   repo      — Пункт [four-projects-one-push] 2026-10-01: пропуск сборок
#               Vercel по проектам (самопроверка скрипта) и согласованность
#               реестра ручных миграций с каталогом.
#
# ЧЕГО ЭТОТ CI НЕ ДЕЛАЕТ. Он не деплоит: деплоем занимается Git-интеграция
# Vercel, и зелёный CI её НЕ СТОРОЖИТ сам по себе — чтобы красный CI
# останавливал выкат, в GitHub нужно включить защиту ветки и назвать эти
# джобы обязательными. Пока это не включено, CI говорит правду и ничего не
# запрещает; так и написано, чтобы зелёная галочка не выглядела замком.
#
# Джобы намеренно раздельные: красный CI должен сразу говорить, ЧТО
# сломано, а не «что-то в пайплайне». Общий шаг установки вынесен в
# composite-действие .github/actions/setup.

name: CI

on:
  # Только основная ветка + все PR: `branches: ['**']` вместе с
  # pull_request давал бы двойной прогон всех пяти джоб на каждый PR
  # внутри репозитория (concurrency их не схлопывает — refs/heads/x и
  # refs/pull/N/merge это разные группы).
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma генерирует клиент на каждом шаге установки; ключи и реальная
  # БД для этого не нужны — URL-заглушка валидного формата.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  # Пункт [validate-asked-for-the-second-url] 2026-10-01: заглушки было
  # ОДНОЙ, а `schema.prisma` объявляет две — `url` и `directUrl`. Джоба
  # `Prisma schema` падала на каждом из семнадцати прогонов:
  #
  #   Error code: P1012
  #   error: Environment variable not found: DIRECT_URL.
  #
  # То есть `prisma validate` не проверял схему НИ РАЗУ, а красный CI
  # никто не читал. `prisma generate` при этом проходил — он `directUrl`
  # не разрешает, — и потому остальные джобы были зелёными, что и делало
  # красную галочку похожей на фоновый шум.
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Typecheck (strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build --workspace=apps/api
      - run: npm run build --workspace=apps/tma
      - run: npm run build --workspace=apps/admin
      - run: npm run build --workspace=apps/landing

  prisma:
    name: Prisma schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run prisma:validate --workspace=apps/api

  db:
    name: База — db push и ручные миграции на чистом Postgres 16
    runs-on: ubuntu-24.04

    services:
      # Та же мажорная версия, что в docker-compose и в Supabase: SQL
      # обязан проверяться на том, на чём поедет.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devils_advocate
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Перебивает заглушку из env всего файла: здесь база настоящая.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devils_advocate?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/devils_advocate?schema=public

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Реестр и каталог сверяются ДО применения: файл, не попавший в
      # реестр, иначе был бы молча не проверен — и молча не показан
      # оператору в диагностике схемы.
      - name: реестр ручных миграций согласован с каталогом
        run: node scripts/check-manual-migrations.mjs

      # Пункт [the-file-could-not-be-run-twice] 2026-10-02: форма
      # операторов проверяется здесь, за секунды и без базы, а настоящее
      # двойное применение — в джобе с Postgres. Две проверки не
      # дублируют друг друга: эта называет ПРИЧИНУ («у CREATE TYPE нет
      # IF NOT EXISTS») в момент правки файла, та доказывает следствие.
      - name: ручные миграции выдерживают повторное применение
        run: node scripts/check-sql-repeatable.mjs

      # `db push`, а не `migrate deploy`: в этом проекте нет истории
      # миграций Prisma — схема накатывается push'ем, а всё, что push не
      # умеет, лежит отдельными SQL-файлами.
      - name: prisma db push на чистую базу
        run: npx prisma db push --skip-generate
        working-directory: apps/api

      # Главная проверка этой джобы. Файлы применяются руками, в разные
      # инстансы, поэтому написаны идемпотентно; на свежей схеме каждый
      # ПРИМЕНИМЫЙ обязан быть безвредным повтором. Файл без защиты
      # (`IF NOT EXISTS` и т.п.) упадёт здесь, а не у владельца в SQL
      # Editor на живом проде. Порядок — из реестра, не алфавитный;
      # исторические файлы скрипт в список не отдаёт.
      #
      # Пункт [the-file-could-not-be-run-twice] 2026-10-02: применяется
      # ДВА РАЗА. Один проход доказывает только, что файл подходит к
      # схеме, а написано про эти файлы другое — что повтор безвреден.
      # Первый живой прогон этой джобы нашёл ровно обратное:
      # `intake_session.sql` падал на своём ПЕРВОМ операторе
      # (`CREATE TYPE`, у которого нет `IF NOT EXISTS`), то есть повтор
      # не применял ничего, включая три колонки заморозки проекта в конце
      # файла. Второй проход — и есть проверка того, что написано.
      - name: ручные миграции применяются к свежей схеме (проход 1)
        run: |
          set -euo pipefail
          node scripts/check-manual-migrations.mjs --print-order | while IFS= read -r file; do
            echo "── $(basename "$file")"
            psql "postgresql://postgres:postgres@localhost:5432/devils_advocate" \
              -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: те же файлы выдерживают ПОВТОРНОЕ применение (проход 2)
        run: |
          set -euo pipefail
          node scripts/check-manual-migrations.mjs --print-order | while IFS= read -r file; do
            echo "── повтор $(basename "$file")"
            psql "postgresql://postgres:postgres@localhost:5432/devils_advocate" \
              -v ON_ERROR_STOP=1 -q -f "$file"
          done

      # Схема и то, что делают ручные файлы, обязаны совпадать: иначе
      # кто-то написал SQL и забыл перенести правку в schema.prisma (или
      # наоборот), и расхождение всплывает на проде как «колонки нет».
      #
      # ФЛАГ `continue-on-error` СНЯТ 2026-10-02, прогон 20, как и было
      # здесь обещано. Он стоял, пока проверку не видели живой: локально
      # её запустить нечем (выход к binaries.prisma.sh закрыт политикой
      # egress в обеих средах), а красить весь CI проверкой, которую ни
      # разу не выполняли, нечестно. В прогоне 20 шаг прошёл на настоящем
      # Postgres — значит он больше не «информация», а замок. Проверка,
      # которая не может уронить прогон, не охраняет ничего.
      - name: схема и ручные миграции не разошлись
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
        working-directory: apps/api

      # Сид создаёт AIProvider/AIModel: без него любой AI-вызов падает.
      # Проверяется, что он проходит на чистой базе — это предусловие
      # любого нового инстанса (и отдельной базы, если она когда-нибудь
      # появится).
      - name: сид проходит на чистой базе
        run: npx prisma db seed
        working-directory: apps/api

  # ─────────── Пункт [the-runner-image-was-chosen-by-the-platform] ───────────
  #
  # Эта джоба НЕ красит прогон (`continue-on-error`) и существует ровно
  # затем, чтобы переезд `ubuntu-latest` на Ubuntu 26.04 был ИЗМЕРЕН
  # заранее, а не обнаружен в день, когда он доедет.
  #
  # Остальные семь джоб прибиты к `ubuntu-24.04`. Один пин снимает
  # молчаливую смену ОС, но ничего не говорит о том, переживёт ли проект
  # 26.04 — а узнать это рано стои́т дешевле, чем поздно. Поэтому пин и
  # наблюдение идут вместе: пин держит прод, эта джоба держит знание.
  #
  # ЧТО ИМЕННО ЗДЕСЬ ПРОВЕРЯЕТСЯ, и список короткий НАМЕРЕННО. Из образа
  # раннера проект берёт ровно две вещи, остальное прибито: Node — через
  # `.nvmrc` и `setup-node`, сервер Postgres — образом `postgres:16`.
  # Незакреплённое:
  #
  #  • OpenSSL. 24.04 даёт 3.0.13, 26.04 — 3.5.5. Prisma выбирает движок
  #    по версии libssl, и замерено (вызовом её собственного разбора),
  #    что ЛЮБАЯ 3.x сворачивается в `debian-openssl-3.0.x` — то есть
  #    цель та же. Но «цель та же» и «бинарник, собранный под libssl 3.0,
  #    загрузится при libssl 3.5» — разные утверждения, и второе
  #    проверяется только запуском;
  #  • клиент psql. 24.04 даёт 16.15, 26.04 — 18.6, а сервер остаётся 16.
  #    libpq совместим назад, но ручные миграции применяются именно
  #    клиентом, и «совместим» здесь тоже проверяется запуском.
  ubuntu26-preview:
    name: Предупреждение заранее — Ubuntu 26.04 (не красит прогон)
    runs-on: ubuntu-26.04
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devils_advocate
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devils_advocate?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/devils_advocate?schema=public

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Числа в лог, чтобы следующий заход начинал с факта, а не с
      # предположения о том, что в образе лежит.
      - name: что в образе на самом деле
        run: |
          echo "ОС:      $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "openssl: $(openssl version)"
          echo "psql:    $(psql --version)"
          echo "node:    $(node --version)"
          echo "цель Prisma: $(node -e "require('@prisma/get-platform').getBinaryTargetForCurrentPlatform().then(t=>console.log(t))")"

      # Движок Prisma загружается по-настоящему: generate уже прошёл в
      # составном действии, а здесь проверяется, что клиент СТАРТУЕТ на
      # этой libssl — иначе отказ был бы виден только в рантайме.
      - name: клиент Prisma поднимается на этой libssl
        run: node -e "const {PrismaClient}=require('@prisma/client'); const c=new PrismaClient(); c.\$queryRaw\`select 1 as ok\`.then(r=>{console.log('запрос прошёл:',JSON.stringify(r));return c.\$disconnect()}).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: db push на чистую базу
        run: npx prisma db push --skip-generate
        working-directory: apps/api

      - name: ручные миграции клиентом psql 18 против сервера 16
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "── проход $pass"
            node scripts/check-manual-migrations.mjs --print-order | while IFS= read -r file; do
              psql "postgresql://postgres:postgres@localhost:5432/devils_advocate" \
                -v ON_ERROR_STOP=1 -q -f "$file"
            done
          done

      - name: тесты на этой ОС
        run: npm test --workspace=apps/api

  repo:
    name: Репозиторий — пропуск сборок и реестры
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 2 — самопроверке нужен HEAD^ (она поднимает свой
      # временный репозиторий, но скрипт обращается к git в принципе).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # Пункт [ci-built-on-a-different-node] 2026-10-01: версия Node
      # обязана жить в ОДНОМ месте. Проверяется не равенство с панелью
      # Vercel — её из репозитория не видно НИЧЕМ, — а то, что номер в
      # репозитории не продублирован снова: ровно так он и разошёлся
      # (CI на 20, Vercel на 24). Первая версия этой проверки была
      # трёхстрочным grep здесь же и сработала на комментарии, который
      # цитирует прежнее значение, — поэтому она скрипт со снятием
      # комментариев и с обратной пробой на этот случай.
      - name: версия Node живёт в одном месте
        run: node scripts/check-node-version.mjs

      - name: реестр ручных миграций согласован с каталогом
        run: node scripts/check-manual-migrations.mjs

      # Пункт [the-file-could-not-be-run-twice] 2026-10-02: форма
      # операторов проверяется здесь, за секунды и без базы, а настоящее
      # двойное применение — в джобе с Postgres. Две проверки не
      # дублируют друг друга: эта называет ПРИЧИНУ («у CREATE TYPE нет
      # IF NOT EXISTS») в момент правки файла, та доказывает следствие.
      - name: ручные миграции выдерживают повторное применение
        run: node scripts/check-sql-repeatable.mjs

      # Пункт [four-projects-one-push] 2026-10-01, попутно: высоких
      # предупреждений аудита зависимостей не видел никто — их не
      # проверяли ни разу. Шаг намеренно НЕ красит CI: закрываются они
      # мажорными обновлениями, и красный до того дня означал бы, что
      # красный перестанут читать. Он виден в логе и станет обязательным
      # вместе с обновлением зависимостей.
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
